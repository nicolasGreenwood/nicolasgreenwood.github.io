baseURL = "https://nicolasgreenwood.github.io"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    title = "Nicolas Greenwood"
    contentDir = "content/en"
    languageName = "English"
    weight = 1
    
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 10
    [[languages.en.menus.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 60
    [[languages.en.menus.main]]
      name = "Articles"
      pageRef = "/articles"
      weight = 40
    [[languages.en.menus.main]]
      name = "Poems"
      pageRef = "/poems"
      weight = 20
    [[languages.en.menus.main]]
      name = "Programming"
      pageRef = "/programming"
      weight = 30
    [[languages.en.menus.main]]
      name = "Misc"
      pageRef = "/misc"
      weight = 50

