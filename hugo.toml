[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
      wrapStandAloneImageWithinParagraph = false
  [markup.highlight]
    style = "catppuccin-latte"
    noClasses = true