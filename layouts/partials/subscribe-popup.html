<div class="sub-popup">
    <button class="close-btn">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="#f9fafb"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
            />
        </svg>
    </button>
    <h3>Subscribe</h3>
    <p>Every time I write something new, straight to your inbox.</p>
    <form
        action="https://buttondown.com/api/emails/embed-subscribe/nicolasgreenwood"
        method="post"
        class="embeddable-buttondown-form"
    >
        <label class="form-label" for="bd-email">Enter your email</label>
        <input
            class="form-input"
            type="email"
            name="email"
            id="bd-email"
            placeholder="email@example.com"
        />
        <div class="form-item">
            <input
                class="button button-large"
                type="submit"
                value="Subscribe"
            />
        </div>
        <p style="margin-top: 1rem; font-size: 12px; font-style: italic">
            <a
                href="https://buttondown.com/refer/nicolasgreenwood"
                target="_blank"
            >
                Powered by Buttondown.
            </a>
        </p>
    </form>
</div>
