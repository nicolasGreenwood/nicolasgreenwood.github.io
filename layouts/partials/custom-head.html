<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
/>
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
{{ if .Params.uses_splide }}
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
/>
<style>
    .splide {
        margin: 0 auto;
    }

    .thumbnails {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        margin: 8px auto 0;
        padding: 0;
    }

    .thumbnail {
        min-width: 70px;
        height: auto;
        max-height: 120px;
        overflow: hidden;
        list-style: none;
        cursor: pointer;
        opacity: 0.3;
    }

    .thumbnail.is-active {
        opacity: 1;
    }

    .thumbnail img {
        max-height: 100%;
        margin-bottom: 0;
        display: block;
        margin: 0 auto;
    }

    .splide__slide {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
        border-radius: 5px;
        max-height: 90vh;
    }

    .splide__slide img {
        display: block;
        margin: 0 auto;
        border-radius: 0;
        max-height: 100%;
    }
</style>
{{ end }}
<style>
    @view-transition {
        navigation: auto;
    }

    ::view-transition-group(root) {
        animation-duration: 0.5s;
    }

    @keyframes move-out {
        0% {
            opacity: 1;
        }

        40%,
        100% {
            opacity: 0;
        }
    }

    @keyframes move-in {
        0%,
        50% {
            opacity: 0;
            transform: translateY(-50px);
        }

        100% {
            opacity: 1;
            transform: translateY(0px);
        }
    }

    ::view-transition-old(root) {
        animation: 1s cubic-bezier(0.11, 0, 0.5, 0) both move-out;
    }

    ::view-transition-new(root) {
        animation: 1s cubic-bezier(0.5, 1, 0.89, 1) both move-in;
    }

    body {
        background-color: #fbfbfe;
    }

    hr {
        border-color: #dedede;
        border-bottom-width: 0;
    }

    .form-input {
        background-color: #fbfbfe;
    }

    ::placeholder {
        color: #aaa;
    }

    main {
        min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        margin: 0 0 1rem 0;
        font-weight: bold;
    }

    h1 {
        font-size: 2rem;
    }

    h2 {
        font-size: 1.6rem;
    }

    h3 {
        font-size: 1.4rem;
    }

    h4 {
        font-size: 1.2rem;
    }

    h5 {
        font-size: 1.1rem;
    }

    h6 {
        font-size: 1rem;
    }

    .button {

        border: none;
    }

    .button:hover {
        background-color: #ff547f;
    }

    .post-meta {
        margin-left: auto;
    }

    }

    .masthead-title small {

        text-align: left;

    }

    .masthead-title {

    }

    .sidebar-toggle:active,
    .sidebar-toggle:hover,

    #sidebar-checkbox:checked ~ .sidebar-toggle {

    .sidebar-toggle:before,
    .sidebar-toggle:active:before,
    #sidebar-checkbox:focus ~ .sidebar-toggle:before,
    #sidebar-checkbox:checked ~ .sidebar-toggle:before {
        background-position: center;
    }

    .custom-footer {
        padding: 30px 0;
        background-color: #030712;
        color: #9ca3af;
    }

    a.external:after {
        background-color: #030712;
    }

    figcaption {
        font-family: "PT Sans", sans-serif;
        font-size: 14px;
        font-style: italic;
        opacity: 75%;
        margin: 0;
    }

    figure > img {
        margin-bottom: 8px;
    }

    .float-right {
        float: right;
        margin: 0 0 0 20px;
        width: 50%;
        min-width: 200px;
    }

    .float-left {
        float: left;
        margin: 0 20px 0 0;
        width: 50%;
        min-width: 200px;
    }

    .block-image {
        margin: 0;
        width: 100%;
    }

    .texts {
        padding: 0;
    }

    .toc-li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        border-bottom: 1px solid #dedede;
    }

    a > svg {
        vertical-align: text-bottom;
    }

    .footer-bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
    }

    .article-footer {
        margin-top: 5rem;
        border-top: 1px solid #dedede;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        column-gap: 20px;
    }

    .af-item {
        flex: 1;
        min-width: 200px;
    }

    .af-item:nth-child(1) {
        text-align: left;
    }

    .af-item:nth-child(2) {
        text-align: right;
    }

    .af-item > h3 {
        color: #123458;
        font-family: "Roboto Slab", serif;
        font-size: 1.2rem;
        font-style: italic;
    }

    [contenteditable="true"] {
        outline: none;
    }

    [contenteditable="true"]:empty:before {
        content: attr(placeholder);
        cursor: text;
        opacity: 0.5;
        display: block;
    }

    form input[type="number"]:-moz-submit-invalid,
    form input[type="email"]:-moz-submit-invalid,
    form textarea:-moz-submit-invalid,
    form input[type="text"]:-moz-submit-invalid,
    form select:-moz-submit-invalid,
    form input:-moz-ui-invalid,
    .form-item-error .form-input,
    .form-item-error .form-textarea {
        -webkit-box-shadow: none !important;
        -moz-box-shadow: none !important;
        box-shadow: none !important;
    }

    .search-link svg {
        display: block;
    }

    .search-link:hover {
        background-color: #1f2937;
    }

    .logo {
        display: none;
    }

    .sub-popup {
        position: fixed;
        width: 50vw;
        max-width: 500px;
        min-width: 250px;
        padding: 20px;
        bottom: 20px;
        right: 20px;
        background-color: #030712;
        color: #f9fafb;
        border-radius: 5px;
        display: none;
        animation: 1s cubic-bezier(0.5, 1, 0.89, 1) both move-in;
    }

    .sub-popup * {
        color: unset;
    }

    .sub-popup a {
        color: #1982d1;
    }

    .sub-popup p {
        font-size: 16px;
    }

    .sub-popup label {
        color: #9ca3af;
        font-size: 16px;
    }

    .sub-popup input[type="email"] {
        background-color: #111827;
        border-color: #374151;
    }

    .sub-popup input[type="email"]::placeholder {
        color: #4b5563;
    }

    .close-btn {
        background-color: transparent;
        border: none;
        box-sizing: content-box;
        width: 24px;
        height: 24px;
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
    }

    .close-btn:hover {
        background-color: #1f2937;
    }

    @media (min-width: 48em) {
        .masthead {
            padding: 0 20px;
        }

        .masthead-title {
            text-align: left;
        }
        
        .logo {
            display: block;
        }
    }
</style>
