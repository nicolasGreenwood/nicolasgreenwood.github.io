<div id="site-contact" class="contact-form">
    <form accept-charset="UTF-8" action="{{ site.Params.Contact.formAction | default site.BaseURL }}" method="POST" id="contact-form">
        <input type="hidden" name="access_key" value="c576153c-536b-4494-b8f1-3dc26f076edd" />
        <input type="hidden" name="subject" value="New Submission from Web3Forms" />
        <input type="hidden" name="redirect" value="https://localhost:1313/thanks/">
        <input type="checkbox" name="botcheck" id="" style="display: none;" />
        <div class="form-item">
            <label for="name" class="form-label">{{ i18n "your_name" }}</label>
            <input type="text" id="name" name="name" class="contact-form-input form-input" placeholder="Franz Kafka" required aria-labelledby="name">
        </div>

        <div class="form-item">
            <label for="email" class="form-label">{{ i18n "email_address" }}</label>
            <input type="email" id="email" name="email" class="contact-form-input form-input" placeholder="email@example.com" required aria-labelledby="email">
        </div>

        <div class="form-item">
            <label for="message" class="form-label">{{ i18n "message" }}</label>
            <textarea id="message" name="message" class="contact-form-textarea form-input" placeholder="Write something here..." required aria-labelledby="message"></textarea>
        </div>

        <input type="hidden" name="_feedback.language" value="{{ site.Language.Lang }}" >
        <input type="hidden" name="_email.subject" value="{{ site.Params.Contact.emailSubject | default "" }}">

        <div class="form-item">
            <input type="submit" value="{{ i18n "send" }}" class="button button-large">
        </div>
    </form>
</div>
